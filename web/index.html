<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Pool</title>

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta name="theme-color" content="#EFD09E" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/app.css" />
    </head>

    <body>
        <div
            id="auth-gate"
            role="dialog"
            aria-modal="true"
            aria-labelledby="auth-title"
        >
            <div class="auth-card">
                <h1 id="auth-title">Po0l</h1>
                <label for="password" class="sr-only">Password</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    aria-describedby="auth-error"
                    aria-invalid="false"
                    placeholder="Password"
                />
                <p id="auth-error" role="alert" hidden></p>
                <button
                    id="unlock"
                    type="button"
                    aria-label="Unlock with password"
                >
                    Unlock
                </button>
            </div>
        </div>

        <main
            aria-hidden="true"
            inert
        >
            <h1>Po0l</h1>
            <div id="status" role="status" aria-live="polite">[loading…]</div>

            <label for="text" class="sr-only">Shared notes</label>
            <textarea
                id="text"
                placeholder=""
            ></textarea>

            <div class="actions">
                <button
                    id="clear"
                    type="button"
                    aria-label="Clear all text"
                >
                    Clear
                </button>

                <button
                    id="copy"
                    type="button"
                    aria-label="Copy text to clipboard"
                >
                    Copy
                </button>
            </div>
        </main>

        <script src="/app.js"></script>
    </body>
</html>
