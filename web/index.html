<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Pool</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#efd09e" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/app.css" />
    </head>
    <body>
        <div id="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
            <div class="auth-card">
                <h1 id="auth-title">Pool</h1>
                <div class="error-slot"><p id="auth-error" role="alert" hidden></p></div>
                <label for="password" class="sr-only">Password</label>
                <input id="password" type="password" autocomplete="current-password" aria-describedby="auth-error" aria-invalid="false" placeholder="Password" />
                <button id="unlock" type="button">Unlock</button>
            </div>
        </div>

        <main aria-hidden="true" inert>
            <h1>Pool</h1>
            <div class="error-slot"><p id="global-error" role="alert" hidden></p></div>
            <label for="text" class="sr-only">Shared notes</label>
            <textarea id="text"></textarea>
            <div class="actions">
                <button id="clear" type="button">Clear</button>
                <button id="copy" type="button">Copy</button>
            </div>
            <label id="drop-zone" for="file-input">
                <input id="file-input" type="file" multiple hidden />
                <span class="upload-label"><span aria-hidden="true">↑</span> Add files</span>
                <span class="drop-label">Drop files here</span>
            </label>
            <section id="files-section" aria-label="Shared files">
                <div id="files"></div>
            </section>
        </main>
        <script src="/app.js"></script>
    </body>
</html>
