<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Pool</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#efd09e" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/app.css" />
    </head>
    <body>
        <div id="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
            <div class="auth-card">
                <h1 id="auth-title">Pool</h1>
                <div class="error-slot"><p id="auth-error" role="alert" hidden></p></div>
                <label for="password" class="sr-only">PIN</label>
                <input id="password" type="password" autocomplete="current-password" aria-describedby="auth-error" aria-invalid="false" placeholder="PIN" />
                <button id="unlock" type="button">Unlock</button>
            </div>
        </div>

        <main aria-hidden="true" inert>
            <header class="page-header"><h1><a id="pool-home" href="#" aria-label="Back to Pool">Pool</a></h1><button id="open-settings" class="icon-button" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M10 2h4l.5 3 2 1.2 2.8-1 2 3.4-2.3 2v2.8l2.3 2-2 3.4-2.8-1-2 1.2-.5 3h-4l-.5-3-2-1.2-2.8 1-2-3.4 2.3-2v-2.8l-2.3-2 2-3.4 2.8 1 2-1.2z M15.5 12a3.5 3.5 0 1 0-7 0 3.5 3.5 0 1 0 7 0Z" fill="currentColor" fill-rule="evenodd"/></svg></button><button id="close-settings" class="icon-button" type="button" aria-label="Close settings" hidden><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button></header>
            <div id="pool-screen">
                <div class="error-slot"><p id="global-error" role="alert" hidden></p></div>
                <label for="text" class="sr-only">Shared notes</label>
                <textarea id="text"></textarea>
                <div class="actions">
                    <button id="clear" type="button">Clear</button>
                    <button id="copy" type="button">Copy</button>
                </div>
                <label id="drop-zone" for="file-input">
                    <input id="file-input" type="file" multiple hidden />
                    <span class="upload-label"><span aria-hidden="true">↑</span> Add files</span>
                    <span class="drop-label">Drop files here</span>
                </label>
                <section id="files-section" aria-label="Shared files">
                    <div id="files"></div>
                </section>
            </div>
            <section id="settings-screen" aria-label="Settings" tabindex="-1" hidden>
                <div class="error-slot"><p id="password-error" role="alert" hidden></p></div>
                <form id="pin-form" autocomplete="off" novalidate>
                    <div class="protection-row">
                        <label id="protection-label" for="settings-pin">PIN</label>
                        <button id="password-toggle" type="button" role="switch" aria-checked="true" aria-labelledby="protection-label"><span aria-hidden="true"></span></button>
                    </div>
                    <div class="pin-field">
                        <input id="settings-pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="PIN" aria-describedby="settings-message password-error" aria-invalid="false" />
                        <button id="toggle-pin-visibility" type="button" aria-label="Show PIN" aria-controls="settings-pin" disabled>
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                                <path class="eye-slash" d="m3 3 18 18" />
                            </svg>
                        </button>
                    </div>
                    <button id="save-password" type="submit">Save</button>
                    <p id="settings-message" role="status" aria-live="polite"></p>
                </form>
            </section>
        </main>
        <script src="/app.js"></script>
    </body>
</html>
