<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Pool</title>

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1.0"
        />

        <script src="https://cdn.tailwindcss.com"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            bg: "#EFD09E",
                            primary: "#272727",
                        },
                    },
                },
            };
        </script>
        <style>
            textarea,
            button {
                -webkit-appearance: none;
                border-radius: 0 !important;
            }
            * {
                -webkit-tap-highlight-color: transparent;
            }
            button {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
        </style>
    </head>

    <body
        class="bg-bg text-primary md:h-auto h-[100dvh] flex flex-col items-center"
    >
        <div
            class="w-full max-w-xl p-6 flex flex-col h-full md:h-auto md:mt-10"
        >
            <h1 class="text-6xl font-bold leading-none mb-1 tracking-tight">
                Po0l
            </h1>
            <div
                id="status"
                class="text-xl font-bold mb-4 transition-opacity duration-300"
            >
                [saved]
            </div>

            <textarea
                id="text"
                class="flex-1 md:flex-none md:h-[512px] w-full border-[3px] border-primary p-4 bg-transparent resize-none outline-none text-lg leading-relaxed placeholder-primary/40 overflow-y-auto"
                placeholder=""
            ></textarea>

            <div class="flex gap-4 mt-6 pb-2">
                <button
                    id="clear"
                    class="flex-1 border-[3px] border-primary py-4 text-xl font-bold uppercase active:bg-primary active:text-bg transition-colors"
                >
                    Clear
                </button>

                <button
                    id="copy"
                    class="flex-1 border-[3px] border-primary py-4 text-xl font-bold uppercase active:bg-primary active:text-bg transition-colors"
                >
                    Copy
                </button>
            </div>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
