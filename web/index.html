<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Pool</title>

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1.0"
        />
        <meta name="theme-color" content="#EFD09E" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

        <script src="https://cdn.tailwindcss.com"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            bg: "#EFD09E",
                            primary: "#272727",
                        },
                    },
                },
            };
        </script>
        <style>
            body,
            button,
            textarea,
            input {
                color: #272727;
                caret-color: #272727;
            }
            textarea,
            button,
            input {
                -webkit-appearance: none;
                border-radius: 0 !important;
                border-color: #272727;
            }
            textarea::placeholder,
            input::placeholder {
                color: rgba(39, 39, 39, 0.4);
            }
            ::selection {
                background-color: #272727;
                color: #EFD09E;
            }
            * {
                -webkit-tap-highlight-color: transparent;
            }
            button {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
            button:focus-visible,
            textarea:focus-visible,
            input:focus-visible {
                outline: none;
            }
            button:focus-visible {
                background-color: #272727;
                color: #EFD09E;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
        </style>
    </head>

    <body
        class="bg-bg text-primary md:h-auto h-[100dvh] flex flex-col items-center"
    >
        <div
            id="auth-gate"
            class="fixed inset-0 bg-bg flex items-center justify-center z-50 hidden"
        >
            <div class="w-full max-w-xl p-6">
                <h1 class="text-6xl font-bold leading-none mb-6 tracking-tight">
                    Po0l
                </h1>
                <label for="password" class="sr-only">Password</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    class="w-full border-[4px] border-primary p-4 bg-transparent outline-none text-lg mb-4"
                    placeholder="Password"
                />
                <button
                    id="unlock"
                    type="button"
                    aria-label="Unlock with password"
                    class="w-full border-[4px] border-primary py-4 text-xl font-bold uppercase active:bg-primary active:text-bg transition-colors"
                >
                    Unlock
                </button>
            </div>
        </div>

        <main
            class="w-full max-w-xl p-6 flex flex-col h-full md:h-auto md:mt-10"
        >
            <h1 class="text-6xl font-bold leading-none mb-1 tracking-tight">
                Po0l
            </h1>
            <div
                id="status"
                role="status"
                aria-live="polite"
                class="text-xl font-bold mb-4 min-h-7 transition-opacity duration-150 ease-out"
            >
                [saved ✓]
            </div>

            <label for="text" class="sr-only">Shared notes</label>
            <textarea
                id="text"
                class="flex-1 md:flex-none md:h-[512px] w-full border-[4px] border-primary p-4 bg-transparent resize-none outline-none text-lg leading-relaxed placeholder-primary/40 overflow-y-auto"
                placeholder=""
            ></textarea>

            <div class="flex gap-4 mt-6 pb-2">
                <button
                    id="clear"
                    type="button"
                    aria-label="Clear all text"
                    class="flex-1 border-[4px] border-primary py-4 text-xl font-bold uppercase active:bg-primary active:text-bg transition-colors"
                >
                    Clear
                </button>

                <button
                    id="copy"
                    type="button"
                    aria-label="Copy text to clipboard"
                    class="flex-1 border-[4px] border-primary py-4 text-xl font-bold uppercase active:bg-primary active:text-bg transition-colors"
                >
                    Copy
                </button>
            </div>
        </main>

        <script src="/app.js"></script>
    </body>
</html>
