services:
  prepare-data:
    image: alpine:3.24
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /data && chmod 700 /data"]
    restart: "no"
    read_only: true
    volumes:
      - pool-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  pool:
    build: .
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${POOL_PORT:-8080}:8080"
    volumes:
      - pool-data:/data
    secrets:
      - app_password
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

secrets:
  app_password:
    file: ./secrets/app_password

volumes:
  pool-data:
    name: pool-data
